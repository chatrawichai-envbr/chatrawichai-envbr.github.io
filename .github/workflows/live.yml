# GitHub Pages (project site of chatrawichai-envbr/doc-scanner-pdf) publishes this repository's main branch as it is
# (.nojekyll: no Jekyll processing), so every link in it is relative:
#   https://chatrawichai-envbr.github.io/doc-scanner-pdf/                           index.html — the web app and the Android app
#   https://chatrawichai-envbr.github.io/doc-scanner-pdf/doc-scanner-pdf/           the web app, published from chatrawichai-envbr/doc-scanner-pdf-code
#                                                                                   by its tools/publish-site.sh (never edited here)
#   https://chatrawichai-envbr.github.io/doc-scanner-pdf/doc-scanner-pdf-android/   the Android app's signed APK, download page and
#                                                                                   privacy policy, pushed by the release job of
#                                                                                   chatrawichai-envbr/doc-scanner-pdf-android (never edited here)
#
# After every push (and daily): the committed app is a stamped build, and the live site serves this exact commit,
# every file byte for byte. Actions are pinned to full commit SHAs.
name: Live site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-site
  cancel-in-progress: true

jobs:
  live:
    name: GitHub Pages serves this commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE: https://chatrawichai-envbr.github.io/doc-scanner-pdf
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The committed app is a stamped build
        run: |
          set -euo pipefail
          build="$(jq -r '.commit // empty' doc-scanner-pdf/version.json)"
          [[ "$build" =~ ^[0-9a-f]{12}$ ]] || { echo "::error::doc-scanner-pdf/version.json has no build commit"; exit 1; }
          grep -qF "js/boot.js?v=${build}\"" doc-scanner-pdf/index.html || { echo "::error::index.html is not stamped with ${build}"; exit 1; }
          grep -qF "var BUILD = '${build}';" doc-scanner-pdf/js/boot.js || { echo "::error::boot.js is not stamped with ${build}"; exit 1; }
          if grep -rl "__APP_BUILD__" doc-scanner-pdf; then echo "::error::unstamped placeholder left"; exit 1; fi
          [ -f .nojekyll ] || { echo "::error::.nojekyll is missing (Jekyll would process the site)"; exit 1; }
          if [ -d doc-scanner-pdf-android ]; then
            apks=(doc-scanner-pdf-android/*.apk)
            [ "${#apks[@]}" = 1 ] && [ -f "${apks[0]}" ] || { echo "::error::doc-scanner-pdf-android must hold exactly one APK"; exit 1; }
            file="$(jq -r '.file' doc-scanner-pdf-android/version.json)"
            [ "doc-scanner-pdf-android/$file" = "${apks[0]}" ] || { echo "::error::version.json names $file, folder has ${apks[0]}"; exit 1; }
            [ "$(jq -r '.sha256' doc-scanner-pdf-android/version.json)" = "$(sha256sum "${apks[0]}" | cut -d' ' -f1)" ] || { echo "::error::APK does not match its SHA-256 in version.json"; exit 1; }
            grep -qF "href=\"$file\" download" doc-scanner-pdf-android/index.html || { echo "::error::the download page does not link $file"; exit 1; }
            echo "doc-scanner-pdf-android is $(jq -r '.version' doc-scanner-pdf-android/version.json)"
          fi
          echo "build=${build}" >> "$GITHUB_ENV"
          echo "doc-scanner-pdf is doc-scanner-pdf-code@${build}"

      - name: GitHub Pages serves this build
        run: |
          set -u
          got=""
          for i in $(seq 1 40); do
            got="$(curl -fsS "${SITE}/doc-scanner-pdf/version.json?t=$(date +%s%N)" | jq -r '.commit' 2>/dev/null || true)"
            [ "$got" = "$build" ] && break
            echo "attempt $i: live version is '${got}', waiting for ${build}…"
            sleep 15
          done
          if [ "$got" != "$build" ]; then
            echo "::error::live version.json reports '${got}', expected ${build} (is GitHub Pages on? Settings → Pages → Deploy from a branch: main, / (root))"
            exit 1
          fi

      # A push that leaves doc-scanner-pdf/ unchanged (home page, the Android folder) is not seen by the step above, so
      # files that do not match yet are checked again while Pages deploys (up to 10 minutes), the others only once.
      - name: Every file is served byte for byte
        run: |
          set -euo pipefail
          mapfile -d '' todo < <(git ls-files -z -- doc-scanner-pdf doc-scanner-pdf-android index.html site.css)
          count="${#todo[@]}"
          for i in $(seq 1 40); do
            left=()
            for f in "${todo[@]}"; do
              want="$(sha256sum "$f" | cut -d' ' -f1)"
              got="$(curl -fsS "${SITE}/${f}?t=$(date +%s%N)" | sha256sum | cut -d' ' -f1)" || got="missing"
              [ "$want" = "$got" ] || left+=("$f")
            done
            [ "${#left[@]}" = 0 ] && break
            echo "attempt $i: ${#left[@]} file(s) not deployed yet (${left[0]} …), waiting…"
            todo=("${left[@]}")
            sleep 15
          done
          for f in "${left[@]}"; do echo "::error::${SITE}/${f} is not the committed file"; done
          [ "${#left[@]}" = 0 ] || exit 1
          echo "${count} files served exactly as committed"

      - name: Home page, app and download page
        run: |
          set -euo pipefail
          home="$(curl -fsS "${SITE}/?t=$(date +%s%N)")"
          grep -qF 'href="doc-scanner-pdf/"' <<<"$home" || { echo "::error::home page does not link the app"; exit 1; }
          grep -qF 'href="site.css"' <<<"$home" || { echo "::error::home page does not use the relative site.css"; exit 1; }
          if grep -qE '(href|src)="/' <<<"$home"; then echo "::error::home page has a root-relative link (the site lives under /doc-scanner-pdf/)"; exit 1; fi
          app="$(curl -fsS "${SITE}/doc-scanner-pdf/?t=$(date +%s%N)")"
          grep -qF "js/boot.js?v=${build}\"" <<<"$app" || { echo "::error::/doc-scanner-pdf/ does not serve index.html of ${build}"; exit 1; }
          if [ -d doc-scanner-pdf-android ]; then
            grep -qF 'href="doc-scanner-pdf-android/"' <<<"$home" || { echo "::error::home page does not link the Android app"; exit 1; }
            file="$(jq -r '.file' doc-scanner-pdf-android/version.json)"
            page="$(curl -fsS "${SITE}/doc-scanner-pdf-android/?t=$(date +%s%N)")"
            grep -qF "href=\"$file\" download" <<<"$page" || { echo "::error::/doc-scanner-pdf-android/ does not offer $file"; exit 1; }
            for f in index.html privacy.html; do
              if grep -qE '(href|src)="/' "doc-scanner-pdf-android/$f"; then echo "::error::doc-scanner-pdf-android/$f has a root-relative link"; exit 1; fi
            done
          fi
          echo "home page, /doc-scanner-pdf/ and the Android download page OK"
